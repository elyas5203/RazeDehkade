<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت و تسویه سفارش | فروشگاه اینترنتی گل و گیاه</title>
  <link rel="stylesheet" href="/golha/assets/css/golha.css">
  <style>
    .checkout-container {
      max-width: 800px;
      margin: 3rem auto;
      padding: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--accent-gold);
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.8rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-light);
      font-family: var(--font-main);
      font-size: 1rem;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent-gold);
    }
    .order-summary {
      background: var(--bg-primary);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }
    .submit-order-btn {
      width: 100%;
      padding: 1rem;
      background: var(--accent-rose);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: var(--font-main);
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.3s;
    }
    .submit-order-btn:hover {
      background: #c02835;
    }
  </style>
  <link rel="stylesheet" href="/golha/assets/css/atelier.css">
  <link rel="stylesheet" href="/golha/assets/css/golha-mobile.css?v=1.0">
</head>
<body>

  <header class="golha-navbar">
    <a href="/golha/index.html" class="brand-logo" style="letter-spacing: 0;">
      فروشگاه اینترنتی گل و گیاه
    </a>
  </header>

  <main class="checkout-container">
    <h2 style="margin-bottom: 1.5rem; color: var(--accent-gold); text-align: center;">سفارش شما</h2>

    <div class="order-summary" id="orderSummary">
      <!-- خلاصه سفارش -->
    </div>

    <form id="checkoutForm">
      <div class="form-group">
        <label for="discountCode">کد تخفیف ویژه (۱۰۰٪):</label>
        <div class="checkout-discount-row" style="display:flex;gap:8px;">
          <input type="text" id="discountCode" inputmode="numeric" maxlength="8" placeholder="کد تخفیف خود را وارد کنید" style="flex:1;" required>
          <button type="button" id="applyDiscountBtn" style="padding:0.8rem 1.4rem;background:var(--accent-gold);color:#121a15;border:none;border-radius:8px;font-weight:bold;cursor:pointer;white-space:nowrap;transition:background 0.2s;">اعمال کد</button>
        </div>
        <div id="discountFeedback" style="margin-top:8px;font-size:0.9rem;min-height:22px;"></div>
      </div>

      <div class="form-group">
        <label for="customerName">نام و نام خانوادگی تحویل‌گیرنده:</label>
        <input type="text" id="customerName" autocomplete="name" placeholder="نام تحویل‌گیرنده" required>
      </div>

      <div class="form-group">
        <label for="phone">شماره تماس جهت هماهنگی پیک:</label>
        <input type="tel" id="phone" placeholder="۰۹۱۲0000000" required>
      </div>

      <div class="form-group">
        <label for="address">آدرس تحویل گل:</label>
        <textarea id="address" rows="3" placeholder="خیابان، پلاک، واحد..." required></textarea>
      </div>

      <div class="form-group">
        <label for="notes">توضیحات خاص یا پیام روی کارت همراه گل (اختیاری):</label>
        <textarea id="notes" rows="2" placeholder="پیام دلخواه روی کارت..."></textarea>
      </div>

      <button type="submit" class="submit-order-btn" id="submitBtn">🌹 ثبت نهایی سفارش و ارسال پیک</button>
    </form>
  </main>

  <script>
    const REQUIRED_INVOICE_IDS = [1, 2, 3, 4, 5];
    let cart = JSON.parse(localStorage.getItem('golha_cart') || '[]').map(item => ({
      ...item,
      quantity: Math.max(1, Number(item.quantity || item.qty || 1)),
    }));

    function isExactInvoice(cartItems) {
      if (!Array.isArray(cartItems) || cartItems.length !== 5) return false;
      const ids = cartItems.map(it => Number(it.id));
      const allPresent = REQUIRED_INVOICE_IDS.every(id => ids.includes(id));
      const noExtras = ids.every(id => REQUIRED_INVOICE_IDS.includes(id));
      const allQtyOne = cartItems.every(it => Number(it.quantity || it.qty || 1) === 1);
      return allPresent && noExtras && allQtyOne;
    }

    function getDetailedOosError(cartItems) {
      const unavailable = cartItems.filter(it => !REQUIRED_INVOICE_IDS.includes(Number(it.id)));
      const excess = cartItems.filter(it => REQUIRED_INVOICE_IDS.includes(Number(it.id)) && Number(it.quantity || it.qty || 1) > 1);
      const msgs = [];
      if (unavailable.length > 0) {
        const names = unavailable.map(it => `«${it.name}»`).join('، ');
        msgs.push(`عدم موجودی: محصول ${names} در انبار موجود نیست. لطفاً آن را از سبد خرید کم کنید.`);
      }
      if (excess.length > 0) {
        const names = excess.map(it => `«${it.name}»`).join('، ');
        msgs.push(`عدم موجودی: از محصول ${names} تنها ۱ عدد در انبار موجود است. لطفاً تعداد اضافی را کم کنید.`);
      }
      if (msgs.length === 0 && !isExactInvoice(cartItems)) {
        msgs.push('اقلام سبد خرید کامل نیست (لطفاً هر ۵ محصول فاکتور را به سبد اضافه کنید).');
      }
      return msgs.join('\n');
    }

    if (cart.length === 0) {
      alert('سبد خرید شما خالی است!');
      window.location.href = '/golha/index.html';
    }

    const orderSummaryEl = document.getElementById('orderSummary');
    let subtotal = 0;
    let appliedDiscount = 0;

    function recalcSubtotal() {
      subtotal = 0;
      cart.forEach(item => {
        subtotal += item.price * (item.quantity || 1);
      });
    }

    function changeCheckoutItemQty(productId, delta) {
      const idx = cart.findIndex(it => String(it.id) === String(productId));
      if (idx === -1) return;
      const newQty = (cart[idx].quantity || 1) + delta;
      if (newQty <= 0) {
        cart.splice(idx, 1);
      } else {
        cart[idx].quantity = newQty;
      }
      localStorage.setItem('golha_cart', JSON.stringify(cart));
      if (cart.length === 0) {
        window.location.href = '/golha/index.html';
        return;
      }
      renderOrderSummary();
    }

    function removeCheckoutItem(productId) {
      const idx = cart.findIndex(it => String(it.id) === String(productId));
      if (idx === -1) return;
      cart.splice(idx, 1);
      localStorage.setItem('golha_cart', JSON.stringify(cart));
      if (cart.length === 0) {
        window.location.href = '/golha/index.html';
        return;
      }
      renderOrderSummary();
    }

    function renderOrderSummary() {
      recalcSubtotal();
      const discountAmount = appliedDiscount === 100 ? subtotal : 0;
      const payable = subtotal - discountAmount;
      const unavailable = cart.filter(it => !REQUIRED_INVOICE_IDS.includes(Number(it.id)));
      const excess = cart.filter(it => REQUIRED_INVOICE_IDS.includes(Number(it.id)) && Number(it.quantity || it.qty || 1) > 1);
      const hasOosError = unavailable.length > 0 || excess.length > 0;

      orderSummaryEl.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;">
          <strong>اقلام سبد خرید:</strong>
          <a href="/golha/index.html" style="font-size:0.85rem;color:var(--accent-gold);text-decoration:none;">+ افزودن محصول دیگر از فروشگاه</a>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:0.5rem;">
          ${cart.map(item => {
            const qty = Number(item.quantity || 1);
            const itemTotal = item.price * qty;
            const isAllowed = REQUIRED_INVOICE_IDS.includes(Number(item.id));
            const isExcess = isAllowed && qty > 1;
            const isItemOos = !isAllowed || isExcess;
            return `
              <div class="checkout-item-row" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;background:${isItemOos ? 'rgba(127,29,29,0.22)' : 'rgba(255,255,255,0.03)'};border:1px solid ${isItemOos ? 'rgba(239,68,68,0.55)' : 'var(--border-color)'};flex-wrap:wrap;">
                <div style="flex:1;min-width:180px;">
                  <div style="font-weight:700;color:var(--text-light);">${item.name}</div>
                  <div style="font-size:0.85rem;color:var(--text-muted);">${itemTotal.toLocaleString('fa-IR')} ریال</div>
                  ${!isAllowed ? `<div style="margin-top:4px;font-size:0.82rem;font-weight:700;color:#fca5a5;">❌ عدم موجودی: محصول «${item.name}» موجود نیست — لطفاً کم/حذف کنید</div>` : ''}
                  ${isExcess ? `<div style="margin-top:4px;font-size:0.82rem;font-weight:700;color:#fca5a5;">⚠️ عدم موجودی: از «${item.name}» فقط ۱ عدد موجود است — لطفاً کم کنید</div>` : ''}
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <button type="button" onclick="changeCheckoutItemQty('${item.id}', -1)" style="width:30px;height:30px;border-radius:4px;border:1px solid #c9be9f;background:#e6dec9;color:#2b2821;font-weight:bold;cursor:pointer;">-</button>
                  <span style="min-width:22px;text-align:center;font-weight:bold;">${qty}</span>
                  <button type="button" onclick="changeCheckoutItemQty('${item.id}', 1)" style="width:30px;height:30px;border-radius:4px;border:1px solid #c9be9f;background:#e6dec9;color:#2b2821;font-weight:bold;cursor:pointer;">+</button>
                  <button type="button" onclick="removeCheckoutItem('${item.id}')" title="حذف از سبد" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:4px;">🗑️</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        ${hasOosError ? `
          <div style="margin-top: 12px; padding: 11px 14px; background: rgba(239, 68, 68, 0.14); border: 1px solid rgba(239, 68, 68, 0.5); border-radius: 8px; color: #fecaca; font-size: 0.92rem; font-weight: bold; line-height: 1.7;">
            ⚠️ ${getDetailedOosError(cart).replace(/\n/g, '<br>⚠️ ')}
          </div>
        ` : ''}
        <div style="margin-top: 1rem; padding-top: 0.8rem; border-top: 1px dashed var(--border-color); display: flex; flex-direction: column; gap: 6px;">
          <div style="display:flex; justify-content:space-between; font-size: 0.95rem; color: var(--text-muted);">
            <span>مجموع قیمت اقلام:</span>
            <span>${subtotal.toLocaleString('fa-IR')} ریال</span>
          </div>
          ${appliedDiscount > 0 ? `
            <div style="display:flex; justify-content:space-between; font-size: 0.95rem; color: #22c55e; font-weight: bold;">
              <span>تخفیف ویژه سفارش (۱۰۰٪):</span>
              <span>${discountAmount.toLocaleString('fa-IR')}- ریال</span>
            </div>
          ` : ''}
          <div style="display:flex; justify-content:space-between; margin-top: 6px; font-weight: bold; font-size: 1.1rem; color: var(--accent-gold);">
            <span>مبلغ قابل پرداخت:</span>
            <span style="${appliedDiscount > 0 ? 'color: #22c55e;' : ''}">${appliedDiscount > 0 ? '۰ ریال (رایگان با کد تخفیف)' : `${payable.toLocaleString('fa-IR')} ریال`}</span>
          </div>
        </div>
      `;
    }

    renderOrderSummary();

    try {
      const reg = JSON.parse(sessionStorage.getItem('golha_registered_teacher') || localStorage.getItem('golha_registered_teacher') || 'null');
      if (reg) {
        if (reg.name && document.getElementById('customerName')) document.getElementById('customerName').value = reg.name;
        if (reg.phone && document.getElementById('phone')) document.getElementById('phone').value = reg.phone;
      }
    } catch (_) {}

    const discountInput = document.getElementById('discountCode');
    const applyDiscountBtn = document.getElementById('applyDiscountBtn');
    const discountFeedback = document.getElementById('discountFeedback');

    function cleanDigits(val) {
      return String(val || '')
        .trim()
        .replace(/[۰-۹]/g, digit => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(digit)))
        .replace(/[٠-٩]/g, digit => String('٠١٢٣٤٥٦٧٨٩'.indexOf(digit)));
    }

    applyDiscountBtn.addEventListener('click', async () => {
      const code = cleanDigits(discountInput.value);
      if (!code) {
        discountFeedback.style.color = '#ef4444';
        discountFeedback.textContent = 'لطفاً کد تخفیف را وارد کنید.';
        return;
      }

      applyDiscountBtn.disabled = true;
      discountFeedback.style.color = 'var(--text-muted)';
      discountFeedback.textContent = 'در حال اعتبارسنجی کد تخفیف…';

      try {
        const res = await fetch('/api/store/validate-discount', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ discountCode: code }),
        });
        const result = await res.json();
        if (res.ok && result.success) {
          appliedDiscount = 100;
          renderOrderSummary();
          discountFeedback.style.color = '#22c55e';
          discountFeedback.innerHTML = `✅ <strong>کد تخفیف ۱۰۰ درصدی با موفقیت اعمال شد.</strong> مبلغ قابل پرداخت به ۰ ریال تغییر یافت.`;
        } else {
          appliedDiscount = 0;
          renderOrderSummary();
          discountFeedback.style.color = '#ef4444';
          discountFeedback.textContent = `❌ ${result.message || 'کد تخفیف نامعتبر است.'}`;
        }
      } catch (err) {
        discountFeedback.style.color = '#ef4444';
        discountFeedback.textContent = 'خطا در بررسی کد تخفیف از سرور.';
      } finally {
        applyDiscountBtn.disabled = false;
      }
    });

    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'در حال ثبت سفارش...';

      if (cart.length === 0) {
        alert('سبد خرید شما خالی است!');
        window.location.href = '/golha/index.html';
        return;
      }

      if (!isExactInvoice(cart)) {
        alert(getDetailedOosError(cart));
        submitBtn.disabled = false;
        submitBtn.textContent = '🌹 ثبت نهایی سفارش و ارسال پیک';
        return;
      }

      const payload = {
        discountCode: cleanDigits(discountInput.value),
        customerName: document.getElementById('customerName').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        items: cart,
      };

      try {
        const res = await fetch('/api/store/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (data.success) {
          // پاک کردن سبد خرید و ذخیره اطلاعات سفارش در localStorage به همراه شماره و کد تخفیف جهت تشخیص یوزر تست
          localStorage.removeItem('golha_cart');
          const lastOrder = {
            ...data.data,
            discountCode: payload.discountCode,
            phone: payload.phone,
          };
          localStorage.setItem('golha_last_order', JSON.stringify(lastOrder));
          window.location.href = '/golha/order-status.html';
        } else {
          alert(data.message || 'عدم موجودی');
          submitBtn.disabled = false;
          submitBtn.textContent = '🌹 ثبت نهایی سفارش و ارسال پیک';
        }
      } catch (err) {
        console.error('Error submitting order:', err);
        alert('خطای ارتباط با سرور.');
        submitBtn.disabled = false;
        submitBtn.textContent = '🌹 ثبت نهایی سفارش و ارسال پیک';
      }
    });
  </script>
  <script src="/assets/js/audio-unlock.js"></script>
</body>
</html>
