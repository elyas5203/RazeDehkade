<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود کد روی بسته | سامانه کارآگاه</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/cyber.css">
  <style>
    body {
      background-color: #0b0c10;
      color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    .enter-card {
      background: #1f2833;
      border: 3px solid #66fcf1;
      border-radius: 20px;
      padding: 3rem;
      width: 480px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 0 35px rgba(102, 252, 241, 0.4);
    }

    .enter-card h1 {
      font-size: 2.2rem;
      color: #66fcf1;
      margin-bottom: 0.8rem;
      font-weight: 800;
    }

    .enter-card p {
      font-size: 1.2rem;
      color: #c5c6c7;
      margin-bottom: 2rem;
    }

    .digits-group {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
      direction: ltr;
    }

    .digit-input {
      width: 55px;
      height: 65px;
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      background: #0b0c10;
      border: 2px solid #45a29e;
      border-radius: 12px;
      color: #66fcf1;
      outline: none;
      transition: all 0.3s;
    }

    .digit-input:focus {
      border-color: #66fcf1;
      box-shadow: 0 0 15px #66fcf1;
    }

    .submit-btn {
      width: 100%;
      padding: 1.2rem;
      background: #45a29e;
      color: #0b0c10;
      border: none;
      border-radius: 12px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }

    .submit-btn:hover {
      background: #66fcf1;
      box-shadow: 0 0 20px #66fcf1;
      transform: scale(1.02);
    }

    /* اورلی انیمیشن نفوذ سایبری */
    #cyberHackOverlay {
      position: fixed;
      inset: 0;
      background-color: #050508;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #matrixCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.85;
    }

    .hack-hud {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 600px;
      padding: 2.5rem;
      background: rgba(10, 10, 15, 0.9);
      border: 3px solid #ff0055;
      box-shadow: 0 0 45px #ff0055;
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <main class="enter-card">
    <h1>🔑 ورود کد بسته گل</h1>
    <p>کد ۶ رقمی روی کارت همراه گل را وارد کنید:</p>

    <div class="digits-group">
      <input type="text" class="digit-input" maxlength="1" autofocus>
      <input type="text" class="digit-input" maxlength="1">
      <input type="text" class="digit-input" maxlength="1">
      <input type="text" class="digit-input" maxlength="1">
      <input type="text" class="digit-input" maxlength="1">
      <input type="text" class="digit-input" maxlength="1">
    </div>

    <button class="submit-btn" id="verifyBtn">🚀 ورود به اتاق چت کارآگاه</button>
  </main>

  <div id="cyberHackOverlay">
    <canvas id="matrixCanvas"></canvas>
    <div class="hack-hud">
      <div style="color:#ff0055; font-size:2.2rem; font-weight:800; margin-bottom:1rem;">⚠️ SYSTEM INFILTRATION DETECTED ⚠️</div>
      <div style="color:#00ff66; font-size:1.2rem; font-family:monospace; margin-bottom:1rem;" id="hackLog">&gt; ACCESS GRANTED: SECRET DETECTIVE CHANNEL</div>
      <div style="width:100%; height:12px; background:#111; border:1px solid #ff0055; border-radius:6px; overflow:hidden;">
        <div style="height:100%; width:0%; background:#ff0055; transition:width 0.1s linear;" id="progressFill"></div>
      </div>
    </div>
  </div>

  <script>
    const inputs = document.querySelectorAll('.digit-input');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    // پر کردن اتوماتیک کد در صورت وجود سفارش قبلی
    const lastOrder = JSON.parse(localStorage.getItem('golha_last_order') || '{}');
    if (lastOrder && lastOrder.packageCode && lastOrder.packageCode.length === 6) {
      const chars = lastOrder.packageCode.split('');
      inputs.forEach((inp, i) => {
        if (chars[i]) inp.value = chars[i];
      });
    }

    document.getElementById('verifyBtn').addEventListener('click', verifyCode);

    async function verifyCode() {
      const code = Array.from(inputs).map(i => i.value.trim()).join('');
      if (code.length < 6) {
        alert('لطفا کد ۶ رقمی را کامل وارد کنید.');
        return;
      }

      try {
        const res = await fetch('/api/auth/user/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });

        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('userToken', data.token);
          sessionStorage.setItem('userSession', JSON.stringify(data.session));

          startTransition();
        } else {
          alert('کد اشتباه است: ' + data.message);
        }
      } catch (err) {
        alert('خطا در ارتباط با سرور.');
      }
    }

    function startTransition() {
      const overlay = document.getElementById('cyberHackOverlay');
      overlay.style.display = 'flex';

      const canvas = document.getElementById('matrixCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const chars = '0101010101010101ABCDEFGHJKMNOPQRSTUVWXYZ';
      const fontSize = 16;
      const columns = canvas.width / fontSize;
      const drops = Array.from({ length: columns }).fill(1);

      function drawMatrix() {
        ctx.fillStyle = 'rgba(5, 5, 8, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff66';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }

      const matrixInterval = setInterval(drawMatrix, 33);
      const progressFill = document.getElementById('progressFill');
      let progress = 0;

      const progressInterval = setInterval(() => {
        progress += 4;
        progressFill.style.width = progress + '%';

        if (progress >= 100) {
          clearInterval(progressInterval);
          clearInterval(matrixInterval);
          window.location.href = '/chat.html';
        }
      }, 50);
    }
  </script>
</body>
</html>
