<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شبکه محرمانه دستیاران کارآگاه | ورود به سیستم</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/cyber.css">
  <style>
    .landing-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at center, #0c102b 0%, #05050a 100%);
    }

    .login-box {
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      text-align: center;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .code-input-group {
      margin: 24px 0;
    }

    .code-input-group input {
      width: 100%;
      font-family: var(--font-code);
      font-size: 24px;
      letter-spacing: 8px;
      text-align: center;
      color: var(--neon-cyan);
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .error-msg {
      color: var(--neon-magenta);
      font-size: 13px;
      margin-top: 10px;
      min-height: 20px;
      text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
    }
  </style>
</head>
<body>

  <div class="landing-wrapper">
    <div class="cyber-card login-box">

      <div class="terminal-header">
        <span class="cyber-subtitle">&gt; SECURE_GATEWAY_v2.4</span>
        <span class="status-indicator online">
          <span class="status-dot"></span> شبکه آنلاین
        </span>
      </div>

      <h1 class="cyber-title" style="font-size: 22px; margin-bottom: 8px;">دستیاران کارآگاه</h1>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">جهت اتصال به کانال رمزنگاری‌شده، کد جلسه را وارد کنید</p>

      <form id="join-form" onsubmit="handleJoin(event)">
        <div class="code-input-group">
          <input type="text" id="session-code" maxlength="8" placeholder="=======" autocomplete="off" required autofocus>
        </div>

        <div id="error-message" class="error-msg"></div>

        <button type="submit" class="cyber-btn" style="width: 100%; margin-top: 10px;">
          ⚡ اتصال به ترمینال عملیاتی
        </button>
      </form>

      <div style="margin-top: 28px; font-size: 11px; color: #475569; font-family: var(--font-code);">
        ENCRYPTED END-TO-END // DETECTIVE NET 2025
      </div>

    </div>
  </div>

  <script src="/assets/js/user-landing.js"></script>
</body>
</html>
