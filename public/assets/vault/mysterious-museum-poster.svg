<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="cyanRay" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#04070d" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- پس‌زمینه تیره موزه اسرارآمیز -->
  <rect width="900" height="1200" fill="url(#bgGlow)"/>

  <!-- پرتوهای نوری سقف موزه -->
  <polygon points="450,40 160,820 740,820" fill="url(#cyanRay)"/>
  <polygon points="450,40 280,820 620,820" fill="url(#cyanRay)"/>

  <!-- قاب‌های طلایی کلاسیک Art-Deco -->
  <rect x="36" y="36" width="828" height="1128" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9"/>
  <rect x="52" y="52" width="796" height="1096" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.65"/>

  <!-- تزیینات چهار گوشه قاب -->
  <g stroke="url(#goldGrad)" stroke-width="3" fill="none">
    <path d="M36 110 L110 36 M36 90 L90 36"/>
    <path d="M864 110 L790 36 M864 90 L810 36"/>
    <path d="M36 1090 L110 1164 M36 1110 L90 1164"/>
    <path d="M864 1090 L790 1164 M864 1110 L810 1164"/>
  </g>

  <!-- نشان بالای پوستر -->
  <rect x="290" y="88" width="320" height="42" rx="21" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="450" y="116" text-anchor="middle" fill="#fde68a" font-family="Tahoma, sans-serif" font-size="18" font-weight="bold">🔐 راز گاوصندوق گشوده شد</text>

  <!-- گنبد و ستون‌های نمادین موزه اسرارآمیز -->
  <g transform="translate(450, 385)">
    <circle cx="0" cy="0" r="145" fill="#09101d" stroke="url(#goldGrad)" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
    <!-- سقف مثلثی موزه -->
    <polygon points="-95,-30 0,-95 95,-30" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <line x1="-105" y1="-22" x2="105" y2="-22" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- ستون‌های موزه -->
    <rect x="-75" y="-18" width="16" height="90" fill="url(#goldGrad)" opacity="0.85"/>
    <rect x="-32" y="-18" width="16" height="90" fill="url(#goldGrad)" opacity="0.85"/>
    <rect x="16" y="-18" width="16" height="90" fill="url(#goldGrad)" opacity="0.85"/>
    <rect x="59" y="-18" width="16" height="90" fill="url(#goldGrad)" opacity="0.85"/>
    <!-- پله‌های موزه -->
    <rect x="-95" y="74" width="190" height="10" rx="3" fill="url(#goldGrad)"/>
    <rect x="-110" y="88" width="220" height="12" rx="3" fill="url(#goldGrad)"/>
    <!-- علامت ذره‌بین و کلید اسرار در مرکز -->
    <circle cx="0" cy="24" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text x="0" y="34" text-anchor="middle" fill="#38bdf8" font-family="Georgia, serif" font-size="32" font-weight="bold">?</text>
  </g>

  <!-- تیترهای اصلی پوستر -->
  <text x="450" y="610" text-anchor="middle" fill="#38bdf8" font-family="Tahoma, sans-serif" font-size="22" font-weight="bold" letter-spacing="1">دعوت‌نامه رسمی ویژه دستیاران نخبه کارآگاه</text>
  <text x="450" y="690" text-anchor="middle" fill="url(#goldGrad)" font-family="Tahoma, sans-serif" font-size="56" font-weight="bold" filter="url(#softGlow)">نمایش «موزه اسرارآمیز»</text>
  <line x1="220" y1="730" x2="680" y2="730" stroke="url(#goldGrad)" stroke-width="2" opacity="0.75"/>

  <!-- متن دعوت‌نامه -->
  <rect x="110" y="765" width="680" height="210" rx="16" fill="#09121e" fill-opacity="0.85" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="450" y="818" text-anchor="middle" fill="#f8fafc" font-family="Tahoma, sans-serif" font-size="24" font-weight="bold">تبریک! شما تمام معماهای پرونده را با موفقیت حل کردید.</text>
  <text x="450" y="868" text-anchor="middle" fill="#cbd5e1" font-family="Tahoma, sans-serif" font-size="20">اکنون به عنوان کارآگاهان افتخاری، به رویداد و نمایش حضوری</text>
  <text x="450" y="912" text-anchor="middle" fill="#fde68a" font-family="Tahoma, sans-serif" font-size="23" font-weight="bold">«موزه اسرارآمیز» دعوت شده‌اید تا آخرین راز را از نزدیک کشف کنید!</text>
  <text x="450" y="952" text-anchor="middle" fill="#38bdf8" font-family="Tahoma, sans-serif" font-size="16">پوستر نهایی و زمان‌بندی دقیق حضور از طریق مرکز فرماندهی اعلام می‌گردد</text>

  <!-- مهر مومی طلایی پایین پوستر -->
  <g transform="translate(450, 1065)">
    <circle cx="0" cy="0" r="48" fill="#7c2d12" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="0" y="-4" text-anchor="middle" fill="#fde68a" font-family="Tahoma, sans-serif" font-size="13" font-weight="bold">مهر تایید</text>
    <text x="0" y="18" text-anchor="middle" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="14" font-weight="bold">مرکز فرماندهی</text>
  </g>
</svg>
