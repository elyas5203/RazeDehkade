  <text x="630" y="185" text-anchor="middle" fill="#fde68a" font-family="Tahoma, sans-serif" font-size="44" font-weight="bold">کارت دعوت حضوری «موزه اسرارآمیز»</text>
  <text x="630" y="255" text-anchor="middle" fill="#e2e8f0" font-family="Tahoma, sans-serif" font-size="22">ویژه گروه کارآگاهی پیروز در کشف رمز گاوصندوق اسرار</text>

