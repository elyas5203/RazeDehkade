  </defs>

  <rect width="1000" height="600" rx="24" fill="url(#passBg)"/>
  <rect x="24" y="24" width="952" height="552" rx="18" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <line x1="280" y1="24" x2="280" y2="576" stroke="#fde68a" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>

