    <path d="M-60 108 v34 M-48 108 v34 M-40 108 v34 M-26 108 v34 M-14 108 v34 M0 108 v34 M10 108 v34 M24 108 v34 M38 108 v34 M50 108 v34 M62 108 v34" stroke="#0f172a" stroke-width="4"/>
